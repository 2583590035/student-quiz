<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生答题</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Microsoft YaHei',Arial;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh}
        .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .login-container{background:white;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);padding:50px;max-width:400px;width:100%;text-align:center}
        .login-container h1{color:#333;font-size:28px;margin-bottom:10px}
        .login-container p{color:#666;margin-bottom:30px}
        .form-group{margin-bottom:20px}
        .form-group input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px}
        .form-group input:focus{outline:none;border-color:#667eea}
        .btn-login{width:100%;padding:12px;background:#667eea;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
        .btn-login:hover{background:#5568d3}
        .error-message{color:#d32f2f;margin-top:15px;display:none}
        .quiz-screen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px}
        .quiz-screen.active{display:flex}
        .container{background:white;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);padding:40px;max-width:600px;width:100%}
        .logout-btn{position:fixed;top:20px;right:20px;padding:10px 20px;background:#d32f2f;color:white;border:none;border-radius:8px;cursor:pointer;z-index:100}
        .header{text-align:center;margin-bottom:30px;border-bottom:3px solid #667eea;padding-bottom:20px}
        .header h1{color:#333;font-size:28px}
        .progress-bar{background:#f0f0f0;border-radius:10px;height:8px;margin-bottom:20px;overflow:hidden}
        .progress-fill{background:linear-gradient(90deg,#667eea 0%,#764ba2 100%);height:100%;width:0%;transition:width 0.3s}
        .progress-text{text-align:center;color:#999;font-size:12px;margin-bottom:20px}
        .image-container{margin:30px 0;border-radius:15px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
        .image-container img{width:100%;height:400px;object-fit:cover}
        .answer-box{background:#fff3cd;padding:25px;border-radius:10px;margin-bottom:30px;border:2px dashed #ffc107;cursor:pointer;min-height:100px;display:flex;flex-direction:column;justify-content:center}
        .answer-box.revealed{background:#e8f5e9;border-color:#4caf50;border-style:solid;cursor:default}
        .answer-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.05)}
        .answer-value{color:#333;font-size:14px;font-weight:bold;text-align:right;flex:1}
        .buttons-group{display:flex;gap:15px;margin-top:30px}
        .btn{flex:1;padding:15px;border:none;border-radius:10px;cursor:pointer;font-weight:bold}
        .btn-primary{background:#667eea;color:white}
        .btn-secondary{background:#f0f0f0;color:#333;border:2px solid #ddd}
        .stats{display:flex;gap:15px;justify-content:space-around;margin-bottom:20px;background:#f5f7fa;padding:15px;border-radius:10px}
        .stat{text-align:center;flex:1}
        .stat-value{font-size:20px;color:#667eea;font-weight:bold;margin-top:5px}
        .completion-screen{text-align:center;padding:40px 20px}
        .completion-emoji{font-size:80px;margin-bottom:20px}
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <h1>学生答题系统</h1>
            <p>请输入密码</p>
            <div class="form-group">
                <input type="password" id="password" placeholder="密码" onkeypress="if(event.key==='Enter')login()">
            </div>
            <button class="btn-login" onclick="login()">进入</button>
            <div class="error-message" id="errorMessage">密码错误</div>
        </div>
    </div>

    <div id="quizScreen" class="quiz-screen">
        <button class="logout-btn" onclick="logout()">退出</button>
        <div class="container">
            <div class="header">
                <h1>学生答题</h1>
            </div>
            <div class="stats">
                <div class="stat"><div>共题</div><div class="stat-value" id="totalQuestions">0</div></div>
                <div class="stat"><div>进度</div><div class="stat-value" id="percentage">0%</div></div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div id="quizContent"></div>
        </div>
    </div>

    <script>
        const PASSWORD = 'quiz2024';
        let allStudents = [];
        let currentIndex = 0;
        let answerRevealed = false;

        // 加载数据
        async function loadData() {
            try {
                const response = await fetch('quiz_data.json');
                if (!response.ok) throw new Error('Network error');
                allStudents = await response.json();
                console.log('Data loaded:', allStudents.length);
            } catch (error) {
                console.error('Load error:', error);
                // 如果JSON加载失败，显示错误
                document.getElementById('loginScreen').innerHTML = '<div class="login-container"><h1>错误</h1><p>无法加载数据</p><p style="font-size:12px;color:#999;">' + error + '</p></div>';
            }
        }

        function login() {
            if (document.getElementById('password').value === PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('quizScreen').classList.add('active');
                allStudents = allStudents.sort(() => Math.random() - 0.5);
                showQuestion();
            } else {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('password').value = '';
            }
        }

        function logout() {
            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('password').value = '';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function showQuestion() {
            if (currentIndex >= allStudents.length) {
                document.getElementById('quizContent').innerHTML = '<div class="completion-screen"><div class="completion-emoji">🎉</div><h2>完成!</h2><button class="btn btn-primary" style="width:100%;max-width:300px;margin:20px auto;" onclick="restart()">重新开始</button></div>';
                return;
            }
            const student = allStudents[currentIndex];
            answerRevealed = false;
            const progress = Math.round((currentIndex / allStudents.length) * 100);
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('totalQuestions').textContent = allStudents.length;
            document.getElementById('percentage').textContent = progress + '%';

            document.getElementById('quizContent').innerHTML = `
                <img src="13160/${student.照片}" style="width:100%;border-radius:10px;margin-bottom:20px;height:350px;object-fit:cover;" onerror="this.style.display='none'">
                <div class="answer-box" onclick="revealAnswer()" id="answerBox">
                    <div style="color:#999;font-size:12px;">点击查看答案</div>
                </div>
                <div class="buttons-group">
                    <button class="btn btn-secondary" onclick="previousQuestion()" ${currentIndex === 0 ? 'disabled' : ''}>← 上一题</button>
                    <button class="btn btn-primary" onclick="nextQuestion()">下一题 →</button>
                </div>
            `;
        }

        function revealAnswer() {
            if (answerRevealed) return;
            answerRevealed = true;
            const student = allStudents[currentIndex];
            const answerBox = document.getElementById('answerBox');
            answerBox.classList.add('revealed');
            answerBox.innerHTML = `
                <div style="width:100%;text-align:left;">
                    <div class="answer-item"><div>学号</div><div class="answer-value">${student.学号}</div></div>
                    <div class="answer-item"><div>姓名</div><div class="answer-value">${student.姓名}</div></div>
                    <div class="answer-item"><div>班级</div><div class="answer-value">${student.班级}</div></div>
                    <div class="answer-item"><div>宿舍</div><div class="answer-value">${student.宿舍}</div></div>
                </div>
            `;
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function previousQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                showQuestion();
            }
        }

        function restart() {
            currentIndex = 0;
            allStudents = allStudents.sort(() => Math.random() - 0.5);
            showQuestion();
        }

        // 初始化
        document.getElementById('password').focus();
        loadData();
    </script>
</body>
</html>
