<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生信息题库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .login-container h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .login-container p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            text-align: left;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .error-message {
            color: #d32f2f;
            margin-top: 15px;
            font-size: 12px;
            display: none;
        }

        .success-message {
            color: #388e3c;
            margin-top: 15px;
            font-size: 12px;
            display: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            z-index: 100;
        }

        .logout-btn:hover {
            background: #b71c1c;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
            border-color: #667eea;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat-item {
            background: #f5f7fa;
            padding: 15px 25px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-top: 5px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #f9f9f9;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .card.active {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .card-placeholder {
            width: 100%;
            height: 200px;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
            flex-direction: column;
        }

        .card-footer {
            padding: 12px;
            font-size: 13px;
            color: #666;
            border-top: 1px solid #eee;
        }

        .info-panel {
            position: fixed;
            right: 0;
            top: 0;
            width: 350px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .info-panel.active {
            transform: translateX(0);
        }

        .info-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-header h2 {
            font-size: 18px;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
        }

        .info-content {
            padding: 20px;
        }

        .info-item {
            margin-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 12px;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .info-image {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .overlay {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .search-box {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            grid-column: 1 / -1;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .info-panel {
                width: 100%;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }

            .container {
                padding: 20px;
            }

            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div id="loginScreen" class="login-container">
        <h1>🔐 学生信息题库</h1>
        <p>请输入访问密码</p>
        <div class="form-group">
            <label for="password">密码：</label>
            <input type="password" id="password" placeholder="输入密码" onkeypress="handleKeyPress(event)">
        </div>
        <button class="btn-login" onclick="login()">登录</button>
        <div class="error-message" id="errorMessage">密码错误，请重试</div>
        <div class="success-message" id="successMessage">登录成功，正在加载...</div>
    </div>

    <!-- 主界面 -->
    <div id="mainApp" class="hidden">
        <button class="logout-btn" onclick="logout()">退出登录</button>

        <div class="overlay" id="overlay"></div>

        <div class="container">
            <div class="header">
                <h1>📚 学生信息识别题库</h1>
                <p>点击照片查看学生详细信息</p>
            </div>

            <div class="controls">
                <input type="text" class="search-box" id="searchBox" placeholder="搜索学号、姓名或班级...">
                <button class="btn btn-secondary" id="randomBtn">随机洗牌</button>
                <button class="btn btn-secondary" id="resetBtn">重置</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">总人数</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">已查看</div>
                    <div class="stat-value" id="viewedCount">0</div>
                </div>
            </div>

            <div class="gallery" id="gallery">
                <!-- 卡片将由JavaScript生成 -->
            </div>
        </div>

        <div class="info-panel" id="infoPanel">
            <div class="info-header">
                <h2>学生信息</h2>
                <button class="close-btn" id="closeBtn">&times;</button>
            </div>
            <div class="info-content" id="infoContent">
                <!-- 信息将由JavaScript动态填充 -->
            </div>
        </div>
    </div>

    <script>
        let allStudents = [];
        let filteredStudents = [];
        let currentStudent = null;
        let viewedStudents = new Set();
        let isLoggedIn = false;

        // 设置密码（修改这里以更改密码）
        const PASSWORD = "admin123";

        // 处理回车键登录
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                login();
            }
        }

        // 登录函数
        function login() {
            const passwordInput = document.getElementById('password');
            const enteredPassword = passwordInput.value;

            if (enteredPassword === PASSWORD) {
                document.getElementById('successMessage').style.display = 'block';
                document.getElementById('errorMessage').style.display = 'none';

                setTimeout(() => {
                    isLoggedIn = true;
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    loadData();
                }, 500);
            } else {
                document.getElementById('errorMessage').style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        // 退出登录
        function logout() {
            isLoggedIn = false;
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('password').value = '';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('password').focus();
        }

        // 加载数据
        function loadData() {
            try {
                if (typeof quizDataEmbedded !== 'undefined') {
                    allStudents = quizDataEmbedded;
                    filteredStudents = [...allStudents];
                    renderGallery();
                    updateStats();
                    setupEventListeners();
                    return;
                }
            } catch (error) {
                console.error('加载data.js失败:', error);
            }

            fetch('quiz_data.json')
                .then(response => response.json())
                .then(data => {
                    allStudents = data;
                    filteredStudents = [...allStudents];
                    renderGallery();
                    updateStats();
                    setupEventListeners();
                })
                .catch(error => {
                    console.error('加载失败:', error);
                    document.getElementById('gallery').innerHTML = '<div class="no-results">无法加载数据</div>';
                });
        }

        // 设置事件监听
        function setupEventListeners() {
            document.getElementById('searchBox').addEventListener('input', filterStudents);
            document.getElementById('randomBtn').addEventListener('click', shuffleStudents);
            document.getElementById('resetBtn').addEventListener('click', reset);
            document.getElementById('closeBtn').addEventListener('click', closeInfo);
            document.getElementById('overlay').addEventListener('click', closeInfo);
        }

        // 渲染图片库
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            if (filteredStudents.length === 0) {
                gallery.innerHTML = '<div class="no-results">未找到匹配的学生</div>';
                return;
            }

            filteredStudents.forEach(student => {
                const card = document.createElement('div');
                card.className = 'card';
                if (viewedStudents.has(student.学号)) {
                    card.classList.add('active');
                }

                const imgPath = student.照片;

                card.innerHTML = `
                    <img src="13160/${imgPath}" alt="${student.姓名}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="card-placeholder">${student.学号}</div>
                    <div class="card-footer">${student.学号}</div>
                `;

                card.addEventListener('click', () => showInfo(student, card));
                gallery.appendChild(card);
            });
        }

        // 显示学生信息
        function showInfo(student, cardElement) {
            currentStudent = student;
            viewedStudents.add(student.学号);
            updateStats();

            const infoContent = document.getElementById('infoContent');
            const imgPath = student.照片;

            infoContent.innerHTML = `
                <img src="13160/${imgPath}" alt="${student.姓名}" class="info-image" onerror="this.style.display='none'">
                <div class="info-item">
                    <div class="info-label">学号</div>
                    <div class="info-value">${student.学号}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">姓名</div>
                    <div class="info-value">${student.姓名}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">班级</div>
                    <div class="info-value">${student.班级}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">身份</div>
                    <div class="info-value">${student.身份}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">地址</div>
                    <div class="info-value">${student.地址}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">宿舍</div>
                    <div class="info-value">${student.宿舍}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">其他信息1</div>
                    <div class="info-value">${student.其他1 || '-'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">其他信息2</div>
                    <div class="info-value">${student.其他2 || '-'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">备注</div>
                    <div class="info-value">${student.备注 || '-'}</div>
                </div>
            `;

            document.getElementById('infoPanel').classList.add('active');
            document.getElementById('overlay').classList.add('active');

            document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
            cardElement.classList.add('active');
        }

        // 关闭信息面板
        function closeInfo() {
            document.getElementById('infoPanel').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            currentStudent = null;
        }

        // 更新统计信息
        function updateStats() {
            document.getElementById('totalCount').textContent = allStudents.length;
            document.getElementById('viewedCount').textContent = viewedStudents.size;
        }

        // 搜索功能
        function filterStudents() {
            const searchText = document.getElementById('searchBox').value.toLowerCase();
            if (searchText === '') {
                filteredStudents = [...allStudents];
            } else {
                filteredStudents = allStudents.filter(student =>
                    student.学号.toLowerCase().includes(searchText) ||
                    student.姓名.toLowerCase().includes(searchText) ||
                    student.班级.toLowerCase().includes(searchText)
                );
            }
            renderGallery();
        }

        // 随机洗牌
        function shuffleStudents() {
            filteredStudents = filteredStudents.sort(() => Math.random() - 0.5);
            renderGallery();
        }

        // 重置
        function reset() {
            viewedStudents.clear();
            filteredStudents = [...allStudents];
            document.getElementById('searchBox').value = '';
            updateStats();
            closeInfo();
        }

        // 初始化
        document.getElementById('password').focus();
    </script>
    <script src="data.js"></script>
</body>
</html>
